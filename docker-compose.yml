services:
  portal-postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: portal-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portal

    ports:
      - "5432:5432"

    volumes:
      - portal_pg_data:/var/lib/postgresql/data

volumes:
  portal_pg_data:
